<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><nav class="nav" aria-label="主要導覽">
<a class="brand" href="index.html">年齡與憂鬱、焦慮、壓力</a>
<div class="links">
<a href="index.html">首頁</a>
<a href="results.html">研究結果</a>
<a href="ask.html" aria-current="page">問答</a>
<a href="about.html">關於研究</a>
</div>
<button id="theme" class="btn" type="button"></button>
</nav></header>
<main>
<h1>問答</h1>
<p class="desc">用問題的方式查詢研究結果。</p>
<div class="card">
<h2>請輸入你的問題</h2>
<textarea id="q" rows="3" maxlength="2000" placeholder="例如：哪個年齡層的憂鬱平均分數最高？" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;resize:vertical"></textarea>
<div class="bar" style="margin:10px 0 0"><button id="send" class="btn" type="button">送出</button><span>回答只根據研究摘要表，摘要表沒有的內容會直接說明沒有。</span></div>
<div id="answer" aria-live="polite" style="white-space:pre-wrap;word-break:break-word;margin-top:12px"></div>
</div>
<div class="bar" style="margin-top:16px"><button id="ping" class="btn" type="button">測試連線</button></div>
<pre id="pingOut" aria-live="polite" style="white-space:pre-wrap;word-break:break-word;margin:0"></pre>
<div class="bar" style="margin-top:16px"><button id="gemini" class="btn" type="button">測試 Gemini</button></div>
<pre id="geminiOut" aria-live="polite" style="white-space:pre-wrap;word-break:break-word;margin:0"></pre>
</main>
<footer class="site-footer"><div>第 1 組｜組員：陳政諭</div></footer>
<script>
(function(){const r=document.documentElement,b=document.getElementById("theme");
let t;try{t=localStorage.getItem("dassTheme");}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
function set(x){r.dataset.theme=x;b.textContent=x==="dark"?"☀️ 淺色模式":"🌙 暗黑模式";try{localStorage.setItem("dassTheme",x);}catch(e){}}
set(t);b.onclick=()=>set(r.dataset.theme==="dark"?"light":"dark");})();
</script>
<script>
const API_URL="https://dass-42.d84121629.workers.dev/";
document.getElementById("ping").onclick=async function(){
  const btn=this,out=document.getElementById("pingOut");
  btn.disabled=true;out.textContent="連線中…";
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),10000);
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"test"}),signal:ctrl.signal});
    const text=await res.text();let data=null;
    try{data=JSON.parse(text);}catch(e){}
    if(res.ok)out.textContent="連線成功（HTTP "+res.status+"）\n"+(data?JSON.stringify(data,null,2):text);
    else out.textContent="後端回報錯誤（HTTP "+res.status+"）：\n"+((data&&data.error&&data.error.message)||text||"沒有收到錯誤訊息");
  }catch(e){
    out.textContent=e.name==="AbortError"
      ?"連線逾時（超過 10 秒沒有回應）。"
      :"無法連線到後端（"+e.message+"）。可能是網址有誤、Worker 尚未部署，或這個網站尚未列入後端允許的來源。";
  }finally{clearTimeout(timer);btn.disabled=false;}
};
document.getElementById("gemini").onclick=async function(){
  const btn=this,out=document.getElementById("geminiOut");
  btn.disabled=true;out.textContent="詢問中…（可能需要幾秒）";
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),30000);
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"ask",question:"請用一句話自我介紹"}),signal:ctrl.signal});
    const text=await res.text();let data=null;
    try{data=JSON.parse(text);}catch(e){}
    if(res.ok&&data&&typeof data.answer==="string")out.textContent=data.answer;
    else out.textContent="失敗（HTTP "+res.status+"）："+((data&&data.error&&data.error.message)||text||"沒有收到錯誤訊息");
  }catch(e){
    out.textContent=e.name==="AbortError"
      ?"連線逾時（超過 30 秒沒有回應）。"
      :"無法連線到後端（"+e.message+"）。可能是網址有誤、Worker 尚未部署，或這個網站尚未列入後端允許的來源。";
  }finally{clearTimeout(timer);btn.disabled=false;}
};
(function(){
  const q=document.getElementById("q"),btn=document.getElementById("send"),out=document.getElementById("answer");
  async function send(){
    const question=q.value.trim();
    if(!question){out.textContent="請先輸入問題。";return;}
    btn.disabled=true;q.disabled=true;out.textContent="回答中…";
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),40000);
    try{
      const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"ask",question}),signal:ctrl.signal});
      const text=await res.text();let data=null;
      try{data=JSON.parse(text);}catch(e){}
      if(res.ok&&data&&typeof data.answer==="string")out.textContent=data.answer;
      else out.textContent="無法取得回答（HTTP "+res.status+"）："+((data&&data.error&&data.error.message)||text||"沒有收到錯誤訊息");
    }catch(e){
      out.textContent=e.name==="AbortError"
        ?"等待逾時（超過 40 秒沒有回應），請稍後再試。"
        :"無法連線到後端（"+e.message+"）。請稍後再試。";
    }finally{clearTimeout(timer);btn.disabled=false;q.disabled=false;}
  }
  btn.onclick=send;
  q.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")send();});
})();
</script>
</body>
</html>
