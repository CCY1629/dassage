<h1>年齡與憂鬱、焦慮、壓力的關係</h1>
<p class="desc">本研究使用 DASS-42 線上問卷資料，比較不同年齡層在憂鬱、焦慮與壓力三個分量表上的平均分數與嚴重度分布，了解年齡與情緒困擾程度之間的關聯。</p>

<script>
(function(){const r=document.documentElement,b=document.getElementById("theme");
let t;try{t=localStorage.getItem("dassTheme");}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
function set(x){r.dataset.theme=x;b.textContent=x==="dark"?"☀️ 淺色模式":"🌙 暗黑模式";try{localStorage.setItem("dassTheme",x);}catch(e){}}
set(t);b.onclick=()=>set(r.dataset.theme==="dark"?"light":"dark");})();
</script>
<script>
const PUB_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTzQlH5vfj9J0u1-NffFTSwn__QG1A6Cf_HQIqnwWXXvGfRyL-P6gadGTorGCowQu7wWsjyiLP2O_F1/pub?gid=0&single=true&output=csv";
const NAMES=["憂鬱","焦慮","壓力"],$=s=>document.querySelector(s),num=x=>parseFloat(String(x).replace(/,/g,""));
function parseCSV(t){const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"')q=true; else if(ch===","){r.push(c);c="";}
    else if(ch==="\n"){r.push(c);rows.push(r);r=[];c="";} else if(ch!=="\r")c+=ch;}
  r.push(c);rows.push(r);return rows;}
function parseSummary(rows){
  const h=rows.findIndex(r=>(r[0]||"").trim()==="年齡層"&&(r[1]||"").trim()==="下限");
  if(h<0)throw new Error("找不到統計表");
  const gs=[];
  for(let i=h+1;i<rows.length;i++){const r=rows[i],lab=(r[0]||"").trim();if(!lab||lab==="總計")break;
    gs.push({lab,n:num(r[3]),dep:num(r[4])});}
  if(!gs.length||gs.some(g=>isNaN(g.n)))throw new Error("資料格式不符");
  return gs;
}
function show(gs){
  const g=gs.filter(x=>x.n>0);
  $("#s1").textContent=g.reduce((a,x)=>a+x.n,0);
  $("#s2").textContent=g.length;
  const top=g.reduce((a,x)=>x.dep>a.dep?x:a,g[0]);
  $("#s3").textContent=top.lab;$("#s3l").textContent="憂鬱平均分數最高的年齡層（平均 "+top.dep.toFixed(1)+"）";
}
(async function(){
  try{const res=await fetch(PUB_URL);if(!res.ok)throw new Error("HTTP "+res.status);
    const text=await res.text();show(parseSummary(parseCSV(text)));
    try{localStorage.setItem("dassCsv",text);}catch(e){}
  }catch(e){
    try{show(parseSummary(parseCSV(localStorage.getItem("dassCsv")||"")));$("#status").textContent="無法連線到試算表，顯示的是上次成功載入的數字。";}
    catch(e2){$("#status").textContent="目前無法讀取資料，請稍後到「研究結果」頁重新整理。";}
  }
})();
</script>
