      if(!isNaN(lo)){
        svgEl("line",{x1:x,x2:x,y1:Y(lo),y2:Y(hi),stroke:COL[k],"stroke-width":1.5},svg);
        [lo,hi].forEach(v=>svgEl("line",{x1:x-5,x2:x+5,y1:Y(v),y2:Y(v),stroke:COL[k],"stroke-width":1.5},svg));
      }
      svgEl("circle",{cx:x,cy:Y(p.s.m),r:4.5,fill:COL[k]},svg);
      const h=svgEl("circle",{cx:x,cy:Y(p.s.m),r:12,fill:"transparent"},svg);
      const t=`${NAMES[k]}（${G[p.i].label}）\n平均數：${f(p.s.m)}\n標準差：${f(p.s.sd)}`;
      h.onmousemove=e=>showTip(e,t);h.onmouseleave=hideTip;
    });
  });
  $("#chart").replaceChildren(svg);
  $("#ct").textContent="年齡對各分量的平均數（誤差線為 95% 信賴區間）";
  $("#legend").innerHTML=ks.map(k=>`<span><i style="background:${COL[k]}"></i>${NAMES[k]}</span>`).join("");
}
function drawDist(){
  const k=oneSc(),W=820,H=380,L=130,R=24,T=16,B=56,pw=W-L-R,ph=H-T-B,bh=ph/GR.length*0.62;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  const X=p=>L+pw*p/100;
  for(let p=0;p<=100;p+=20){svgEl("line",{x1:X(p),x2:X(p),y1:T,y2:T+ph,class:"grid"},svg);txt(svg,X(p),T+ph+18,p+"%");}
  txt(svg,L+pw/2,H-10,"各嚴重度等級占該年齡組的百分比");
  txt(svg,W-R,11,"總樣本數 n="+TOTAL,"end");
  G.forEach((g,i)=>{
    const y=T+ph/GR.length*(i+0.5)-bh/2;
    txt(svg,L-8,y+bh/2+4,g.lab,"end");
    let acc=0;
    g.st[k].cnt.forEach((c,j)=>{
      const p=g.n?c/g.n*100:0;
      const r=svgEl("rect",{x:X(acc),y,width:Math.max(0,X(p)-L),height:bh,fill:LC[j],class:"seg"},svg);
      const t=`${LV[j]}\n${f(p,1)}%`;
      r.onmousemove=e=>showTip(e,t);r.onmouseleave=hideTip;
      acc+=p;
    });
  });
  $("#chart").replaceChildren(svg);
  $("#ct").textContent=`各年齡層嚴重度分布：${NAMES[k]}`;
  const c=CUT[k];
  $("#legend").innerHTML=LV.map((l,j)=>`<span><i style="background:${LC[j]}"></i>${l}（${c[j]}${j<4?"–"+(c[j+1]-1):"+"}）</span>`).join("");
}
let SORT={key:"g",dir:-1}; // 預設：年齡組由大到小（50 以上在最前）
function drawTable(){
  const m=mode(),ks=m?sel():[oneSc()],R=[];
  // 預設列順序：年齡組由大到小，同組內依分量表順序
  for(let i=GR.length-1;i>=0;i--)ks.forEach(k=>{
    const g=G[i],s=g.st[k],r={g:i,k,lab:g.lab,n:g.n};
    if(m)Object.assign(r,{m:s.m,sd:s.sd,lo:s.lo,hi:s.hi});
    else s.cnt.forEach((c,j)=>{r["c"+j]=c;r["p"+j]=g.n?c/g.n*100:NaN;});
    R.push(r);
  });
  const cols=m?[["g","年齡組"],["k","分量表"],["n","人數"],["m","平均數"],["sd","標準差"],["lo","95% CI 下限"],["hi","95% CI 上限"]]
              :[["g","年齡組"],["k","分量表"],["n","人數"],...LV.map((l,j)=>["p"+j,l+" 人數（%）"])];
  if(!cols.some(c=>c[0]===SORT.key))SORT={key:"g",dir:-1};
  const v=x=>isNaN(x)?-Infinity:x;
  const rows=R.map((r,i)=>[r,i]).sort((a,b)=>(v(a[0][SORT.key])-v(b[0][SORT.key]))*SORT.dir||a[1]-b[1]).map(x=>x[0]);
  const t=$("#tbl");
  let h="<tr>"+cols.map(([key,lab])=>`<th data-k="${key}" style="cursor:pointer;user-select:none" title="點擊排序">${lab}${SORT.key===key?(SORT.dir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  rows.forEach(r=>{
    h+=`<tr><td>${r.lab}</td><td>${NAMES[r.k]}</td><td>${r.n}</td>`+(m
      ?`<td>${f(r.m)}</td><td>${f(r.sd)}</td><td>${f(r.lo)}</td><td>${f(r.hi)}</td>`
      :LV.map((_,j)=>`<td>${r["c"+j]}（${f(r["p"+j],1)}%）</td>`).join(""))+"</tr>";
  });
  t.innerHTML=h;
  t.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const key=th.dataset.k;
    SORT=SORT.key===key?{key,dir:-SORT.dir}:{key,dir:key==="g"?-1:1};
    drawTable();
  });
}
function drawNotes(){
  const m=mode()==="mean";
  const common=[
    "<b>樣本：</b>已排除年齡不在 10–100 歲者，以及詞彙檢核題（VCL6、VCL9、VCL12，三者皆為不存在的字）任一有勾選者。總人數 "+G.reduce((a,g)=>a+g.n,0)+"。",
    "<b>計分：</b>每題 1–4 分減 1 後加總，採 DASS-42 標準題目歸屬，總分範圍 0–42（未乘 2）。",
    "<b>注意：</b>資料來自自願填答的網路問卷，且受試者多為想取得個人結果者，不能代表一般人口，結果也不代表因果。各年齡組人數差異大，人數少的組別估計較不穩定。"
  ];
  const sp=m?[
    "<b>平均數：</b>該年齡組在該分量表的平均總分，越高表示症狀越嚴重。",
    "<b>標準差：</b>組內分數的離散程度，越大表示個體差異越大。",
    "<b>95% 信賴區間：</b>以 t 分布計算（平均數 ± t × 標準差 ÷ √n）。重複抽樣下約 95% 的區間會涵蓋母體平均數；兩組區間不重疊通常表示差異明顯，但區間重疊不代表無差異。圖中誤差線超出 0–42 的部分已截斷。"
  ]:[
    "<b>嚴重度：</b>依 DASS-42 常用切點（總分未乘 2）分為正常、輕度、中度、重度、極重度；切點見圖下方圖例，各分量表不同。",
    "<b>百分比：</b>該等級人數占該年齡組人數的比例，每條長條加總為 100%。"
  ];
  $("#notes").innerHTML=[...sp,...common].map(s=>`<li>${s}</li>`).join("");
}
function render(){
  const m=mode()==="mean";
  $("#ctrlMean").hidden=!m;$("#ctrlDist").hidden=m;
  m?drawMean():drawDist();drawTable();drawNotes();
}
document.querySelectorAll('input[name=chart],input[name=sc]').forEach(e=>e.onchange=render);
document.querySelectorAll(".cb").forEach(e=>e.onchange=()=>{if(!sel().length)e.checked=true;render();});
function setTheme(t){
  document.documentElement.dataset.theme=t;COL=COLS[t];
  $("#theme").textContent=t==="dark"?"☀️ 淺色模式":"🌙 暗黑模式";
  render();
}
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
setTheme(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
</script>
</body>
